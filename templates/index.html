{% extends "base.html" %}

{% block title %}
Assistant - AI Sentinel
{% endblock %}

{% block content %}

<section class="assistant-panel">

    <h2>Assistant</h2>
    <p>Ask Sentinel a question about internal company information.</p>

    <form method="POST">
        <textarea
            name="message"
            placeholder="Ask Sentinel..."
        ></textarea>

        <button type="submit">Send</button>
    </form>

    {% if response %}
        <div class="response">
            <h3>Sentinel</h3>
            <p>{{ response }}</p>

            {% if source %}
                <p><strong>Source:</strong> {{ source }}</p>
            {% endif %}
        </div>
    {% endif %}

</section>

{% endblock %}
